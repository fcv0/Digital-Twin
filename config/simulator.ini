; ===================================================================
; Simulator / digital-twin configuration. Nothing here affects a real reactor
; run — it only applies when [Debug] Offline = True.
; Reactor/hardware settings live in config.ini alongside this file.
; ===================================================================

[Debug]
Offline = True
; simulator mode
OfflinePorts = 1
; Offline-only wall-clock compression. 1 = real-time; 1000 = 1 real second models
; 1000 simulated seconds. Useful for hammer-testing rolling-window trim + CSV
; append behavior without waiting hours. Ignored when Offline = False.
TimeScale = 1000
; Offline data source: True = physics-based digital twin (DigitalTwin.py) with
; realistic LED/optics/thermal/growth + detector noise, scatter and bubbles;
; False = the lightweight logistic simulator. Ignored when Offline = False.
Twin = True

[Twin]
; Digital-twin growth knobs (demo-tuned overrides of DigitalTwin.py's physical
; defaults so OD growth is visible in a compressed run). Only used when Twin = True.
;
; The OD the twin can reach is set by the optics + biology, NOT by the growth rate:
;
;     OD_max = CalibrationConst * AlphaAtt * CarryingCapacity / ln(10)
;
; with CalibrationConst taken from config.ini [Offsets]. So with the defaults
; below: 5.1 * 2.5e-9 * 1e9 / 2.303 = ~5.5 OD at saturation.
; Raise CarryingCapacity (or AlphaAtt) for a higher ceiling; MuMean only changes
; how FAST it gets there, never how high.
MuMean = 0.002
; Mean specific growth rate (1/s) at the optimal temperature. Sets growth speed only.
InoculationS = 120
; Simulated seconds before cells are added (before this, the vessel is a blank).
LagS = 300
; Lag phase (simulated seconds) after inoculation before growth starts.
CarryingCapacity = 1000000000
; Cells/mL at saturation (1e9). Directly scales the OD ceiling — see formula above.
AlphaAtt = 2.5e-9
; Attenuation per cell/mL: transmission = exp(-AlphaAtt * cells). Also scales the ceiling.
Bubbles = True
; Bubble disturbance events (realistic OD spikes for the Kalman despiker to reject).
;
; Bubble event rates (Poisson events/second at full drive speed). Lower = fewer
; bubbles. These are the "bubbling probability" knobs — reduce them to make the
; simulated OD cleaner. Only used when Bubbles = True.
BubbleMicroRate = 0.09
; Micro-bubbles from aeration/stirring. Tiny, sub-sample, alias into white noise.
; Default 0.09 /s (was 0.9 — reduced 10x). Set ~0.009 for almost none.
BubbleLargeRate = 0.0004
; Large slugs from circulation. Rare, big, multi-second OD excursions (the spikes
; the despiker gates). Default 0.0004 /s (~1 per 40 min). Set 0 to disable them.
BubbleChurnRate = 0.0000667
; Churn/foaming onset rate — a transient regime that multiplies bubble rate +
; amplitude for ~150 s. Default 0.0000667 /s = 1/15000 (~1 per 4 h). Set 0 to disable.

; --- Turbidostat actuation -------------------------------------------------
; The simulator runs the SAME OD control code as live hardware (bang-bang /
; hysteresis / clamp-PI, per the Control Panel), and a dose actually removes
; cells — so the control loop is closed and can be tested offline.
Turbidostat = True
; Fresh-media flow at full pump speed (mL/s). Dose volume = PumpFlow * dose_seconds.
PumpFlow = 0.29
; Working volume (mL). A dose of V mL into Vw dilutes cells by Vw/(Vw+V).
VesselVolume = 50.0
; Seconds between fresh media being pumped and the diluted liquid reaching the
; OPTICAL WINDOW. The pump acts, then nothing changes for this long, THEN OD
; drops — a pure transport delay. This is dead time in the control loop and is
; what makes a turbidostat overshoot / oscillate if the controller is too eager.
TransportLagS = 10.0
; Temperature of the fresh media reservoir (degC). It sits at ambient, NOT at
; setpoint, so every dilution is also a cold shock: T <- (Vw*T + V*Tm)/(Vw+V).
MediaTemp = 25.0
; Circulation speed (%) below which the loop stops actually moving liquid. Under
; this: (1) no fresh sample reaches the optical window, so the OD reading goes
; STALE and stops tracking the vessel; (2) the heater cannot couple into the bulk,
; so temperature decays to ambient no matter what the controller commands.
CirculationThreshold = 50.0
